<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <!-- Text Path for Arched Ribbon Text -->
    <path id="ribbonTextPath" d="M 50 255 Q 250 215 450 255" />
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Radiating Sunburst Rays -->
  <g stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.95">
    <!-- Top & Left Rays -->
    <line x1="210" y1="30" x2="215" y2="70" />
    <line x1="250" y1="20" x2="252" y2="60" />
    <line x1="290" y1="25" x2="286" y2="65" />
    <line x1="170" y1="55" x2="185" y2="90" />
    <line x1="130" y1="85" x2="160" y2="115" />
    <line x1="100" y1="130" x2="140" y2="150" />
    <line x1="75" y1="175" x2="120" y2="185" />
    <line x1="60" y1="215" x2="105" y2="218" />
    
    <!-- Right Rays -->
    <line x1="330" y1="45" x2="320" y2="85" />
    <line x1="375" y1="80" x2="350" y2="115" />
    <line x1="415" y1="125" x2="380" y2="150" />
    <line x1="440" y1="175" x2="400" y2="190" />
    <line x1="455" y1="220" x2="415" y2="225" />
    <line x1="435" y1="265" x2="400" y2="260" />
  </g>

  <!-- 2. Pizza Slice -->
  <g filter="url(#logoGlow)">
    <!-- Main Slice Triangular Base -->
    <path d="M 220 70 L 375 160 L 165 375 Z" fill="#0d0806" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Double Outline Inner Edge -->
    <path d="M 180 345 L 350 170" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <path d="M 172 355 L 178 300" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Fluffy Bubbly Crust on Top -->
    <path d="M 215 75 C 220 50, 245 45, 265 52 C 285 40, 315 45, 330 60 C 350 55, 375 70, 385 90 C 400 110, 405 135, 380 162 L 368 152 C 390 130, 385 110, 372 98 C 362 85, 345 75, 328 78 C 312 65, 288 62, 270 70 C 252 62, 232 65, 222 80 Z" 
          fill="#140d09" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Crust Contour Creases -->
    <path d="M 260 55 Q 262 72 255 82" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 318 60 Q 320 78 312 90" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 365 85 Q 360 105 348 118" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Pepperoni Slices (Angled ellipses) -->
    <!-- Top Pepperoni -->
    <ellipse cx="240" cy="130" rx="28" ry="26" fill="#140d09" stroke="#ffffff" stroke-width="4" transform="rotate(-15 240 130)" />
    <!-- Right Pepperoni -->
    <ellipse cx="320" cy="205" rx="27" ry="25" fill="#140d09" stroke="#ffffff" stroke-width="4" transform="rotate(-10 320 205)" />
    <!-- Bottom Pepperoni -->
    <ellipse cx="250" cy="250" rx="30" ry="27" fill="#140d09" stroke="#ffffff" stroke-width="4" transform="rotate(-12 250 250)" />

    <!-- Melted Cheese Waves / Squiggles -->
    <path d="M 285 125 Q 300 135 315 125" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M 270 170 Q 285 180 300 170" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M 195 310 Q 205 320 215 312" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Slice Tip Droplets / Steam Accents -->
    <circle cx="185" cy="335" r="2.5" fill="#ffffff" />
    <circle cx="195" cy="345" r="2" fill="#ffffff" />
  </g>

  <!-- 3. Arched Ribbon Banner Across Front -->
  <g filter="url(#logoGlow)">
    <!-- Ribbon Shadow/Fold Triangles -->
    <path d="M 68 288 L 68 250 L 95 268 Z" fill="#050302" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 432 288 L 432 250 L 405 268 Z" fill="#050302" stroke="#ffffff" stroke-width="2.5" />

    <!-- Left Ribbon Swallowtail End -->
    <path d="M 85 248 L 30 220 L 60 252 L 25 295 L 85 268 Z" fill="#0d0806" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

    <!-- Right Ribbon Swallowtail End -->
    <path d="M 415 248 L 470 220 L 440 252 L 475 295 L 415 268 Z" fill="#0d0806" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

    <!-- Main Front Ribbon Banner -->
    <path d="M 65 245 Q 250 190 435 245 L 425 310 Q 250 255 75 310 Z" 
          fill="#140d09" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    
    <!-- Inner Border on Banner for Luxury Depth -->
    <path d="M 75 252 Q 250 200 425 252" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.6" />
    <path d="M 83 300 Q 250 248 417 300" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.6" />

    <!-- "HOT PIZZA" Bold Typography on Ribbon -->
    <text font-family="'Lilita One', 'Montserrat', 'Outfit', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">
      <textPath href="#ribbonTextPath" startOffset="50%" text-anchor="middle">
        HOT PIZZA
      </textPath>
    </text>
  </g>

  <!-- 4. "EST 2010" Bottom Subtitle -->
  <text x="250" y="382" font-family="'Montserrat', 'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    EST 2010
  </text>
</svg>
