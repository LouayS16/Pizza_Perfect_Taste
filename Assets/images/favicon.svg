<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#160f0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe53" />
      <stop offset="60%" stop-color="#e06d10" />
      <stop offset="100%" stop-color="#8a3408" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5" />
      <stop offset="50%" stop-color="#fca727" />
      <stop offset="100%" stop-color="#e05300" />
    </linearGradient>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4280e" />
      <stop offset="100%" stop-color="#7a1202" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Dark Disc with Ember Glow for High Visibility on Any Tab -->
  <circle cx="32" cy="32" r="30" fill="#1c110b" stroke="#ff7a00" stroke-width="1.8" />
  <circle cx="32" cy="32" r="28" fill="url(#favGlow)" />

  <!-- Pizza Slice Main Triangle -->
  <g filter="url(#shadow)">
    <!-- Base Sauce Layer -->
    <path d="M 14 19 L 50 19 L 32 54 Z" fill="url(#sauceGrad)" />

    <!-- Melted Golden Cheese Layer -->
    <path d="M 16 21 L 48 21 L 32 51 Z" fill="url(#cheeseGrad)" />

    <!-- Puffy Wood-Fired Crust -->
    <path d="M 11 19 C 14 13, 22 13, 26 15 C 30 13, 34 13, 38 15 C 42 13, 50 13, 53 19 C 48 22, 16 22, 11 19 Z" 
          fill="url(#crustGrad)" stroke="#542207" stroke-width="0.8" />

    <!-- Pepperoni Slices -->
    <circle cx="26" cy="27" r="4.2" fill="#a4220d" stroke="#fce0a0" stroke-width="0.7" />
    <circle cx="38" cy="28" r="4.2" fill="#a4220d" stroke="#fce0a0" stroke-width="0.7" />
    <circle cx="32" cy="38" r="4.2" fill="#a4220d" stroke="#fce0a0" stroke-width="0.7" />

    <!-- Fresh Basil Leaf Accent -->
    <path d="M 31 24 C 33 21, 37 21, 38 24 C 38 27, 33 29, 31 28 C 30 26, 30 25, 31 24 Z" fill="#388e3c" stroke="#1b5e20" stroke-width="0.5" />
    
    <!-- Crust Bubble Blister Details -->
    <circle cx="21" cy="16" r="1.2" fill="#3d1604" />
    <circle cx="32" cy="15" r="1.4" fill="#3d1604" />
    <circle cx="44" cy="16" r="1.2" fill="#3d1604" />
  </g>
</svg>
